name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  BACKEND_IMAGE: promociones-backend:ci
  FRONTEND_IMAGE: promociones-frontend:ci

jobs:
  lint:
    name: Lint (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - name: Instalar dependencias
        working-directory: ${{ matrix.workspace }}
        run: npm ci

      - name: ESLint
        working-directory: ${{ matrix.workspace }}
        run: npm run lint

  test:
    name: Test (${{ matrix.workspace }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - name: Instalar dependencias
        working-directory: ${{ matrix.workspace }}
        run: npm ci

      - name: Vitest
        working-directory: ${{ matrix.workspace }}
        run: npm test

  build:
    name: Build imágenes Docker
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen del backend
        run: docker build -t "$BACKEND_IMAGE" ./backend

      - name: Construir imagen del frontend
        run: docker build -t "$FRONTEND_IMAGE" ./frontend

      - name: Exportar imágenes
        run: |
          mkdir -p /tmp/images
          docker save "$BACKEND_IMAGE"  -o /tmp/images/backend.tar
          docker save "$FRONTEND_IMAGE" -o /tmp/images/frontend.tar

      - uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: /tmp/images
          retention-days: 1

  smoke-test:
    name: Smoke test (docker compose + /health)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp/images

      - name: Cargar las imágenes construidas
        run: |
          docker load -i /tmp/images/backend.tar
          docker load -i /tmp/images/frontend.tar

      - name: Preparar el entorno desde GitHub Secrets
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        run: |
          {
            echo "POSTGRES_USER=${POSTGRES_USER:-promociones}"
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
            echo "POSTGRES_DB=${POSTGRES_DB:-promociones}"
            echo "POSTGRES_PORT=5432"
            echo "BACKEND_PORT=3001"
            echo "FRONTEND_PORT=8080"
            echo "NODE_ENV=production"
          } > .env

      - name: Verificar variables de entorno obligatorias
        run: |
          chmod +x scripts/check-env.sh
          ./scripts/check-env.sh .env

      - name: Levantar la aplicación
        run: |
          docker version
          docker compose version
          docker compose --env-file .env up -d --no-build
          docker compose ps -a

      - name: Esperar a que los contenedores estén sanos
        run: |
          set -uo pipefail
          CONTENEDORES="promociones-db promociones-backend promociones-frontend"
          for intento in $(seq 1 40); do
            pendientes=""
            for c in $CONTENEDORES; do
              estado="$(docker inspect --format '{{.State.Health.Status}}' "$c" 2>/dev/null)" \
                || estado="no-existe"
              [ "$estado" = "healthy" ] || pendientes="$pendientes $c=$estado"
            done
            if [ -z "$pendientes" ]; then
              echo "Los 3 contenedores están healthy."
              exit 0
            fi
            echo "Intento $intento/40 -> pendientes:$pendientes"
            sleep 5
          done
          echo "::error::Los contenedores no alcanzaron el estado healthy." >&2
          docker compose ps -a
          exit 1

      - name: Ejecutar el smoke test
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh http://localhost:3001 http://localhost:8080

      - name: Diagnóstico (si algo falló)
        if: failure()
        run: |
          docker compose ps -a
          docker inspect -f '{{.Name}} {{.State.Status}} {{.State.Health.Status}}' promociones-db promociones-backend promociones-frontend || true
          docker compose logs --no-color --tail 200

      - name: Detener la aplicación
        if: always()
        run: docker compose down -v
